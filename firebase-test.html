
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Faith - Firebase Test</title>

  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    button {
      background: #d5b36a;
      color: #101827;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      width: 100%;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    pre {
      background: #202c3e;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <h2>Daily Faith</h2>
  <h3>Firebase Installation Diagnostic</h3>

  <p>
    This test checks whether Google accepts the new Firebase API key.
  </p>

  <button id="test">RUN FIREBASE TEST</button>

  <h3>Test result</h3>

  <pre id="result">Waiting for test...</pre>

  <script>
    const API_KEY = "AIzaSyBWGNw9mtDN9iFrxUYx_Bko0JZjgS7C180";

    document.getElementById("test").addEventListener("click", async () => {
      const output = document.getElementById("result");
      const button = document.getElementById("test");

      button.disabled = true;
      output.textContent = "Testing Firebase...";

      try {
        const alphabet =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

        const random = crypto.getRandomValues(new Uint8Array(21));

        const fid = "c" +
          Array.from(random, x => alphabet[x % 64]).join("");

        const response = await fetch(
          "https://firebaseinstallations.googleapis.com/v1/projects/daily-faith-27eb2/installations",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY
            },
            body: JSON.stringify({
              fid: fid,
              appId: "1:147411163183:web:38162d27a19e2f5115ceda",
              authVersion: "FIS_v2",
              sdkVersion: "w:0.6.0"
            })
          }
        );

        const body = await response.text();

        output.textContent =
          "HTTP STATUS: " + response.status +
          "\n\nRESPONSE:\n" + body;

      } catch (error) {
        output.textContent =
          "BROWSER ERROR:\n" + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
